# Lint, tests, and image build. GitHub Pages is published from the main branch
# by GitHub's built-in pages-build-deployment (source: branch / root). Do not
# add actions/deploy-pages here: that action requires Pages source = GitHub
# Actions plus environment: github-pages, which is not how this repo publishes
# (and was failing CI while the site was already live).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check src tests

      - name: Run pytest
        run: pytest --tb=short -q

      - name: Build Docker image
        run: docker build -t rag-technical-assistant:test .
